name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: npm install
      - name: Copy the game into www
        run: mkdir -p www && cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build the APK
        shell: bash
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Show the error if the build failed
        if: failure()
        run: echo "::error::$(grep -E 'error|Error|FAILED|wrong|Could not|What went' build.log | head -12 | tr '\n' '|')"
      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MathsAdventure.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MathsAdventure-apk
          path: MathsAdventure.apk
      - name: Publish a download link (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest MathsAdventure.apk --title "Maths Adventure (Android APK)" --notes "Download MathsAdventure.apk on your Android phone, open it and allow installs from this source. The game works offline."
