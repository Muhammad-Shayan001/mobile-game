name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install
      - name: Copy the game into www
        run: mkdir -p www && cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build the APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MathsAdventure.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MathsAdventure-apk
          path: MathsAdventure.apk
      - name: Publish a download link (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest MathsAdventure.apk --title "Maths Adventure (Android APK)" --notes "Download MathsAdventure.apk on your Android phone, open it and allow installs from this source. The game works offline."
